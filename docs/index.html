<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>全球24h — 国际新闻聚合</title>
  <meta name="description" content="24 小时全球新闻聚合，支持中文与英文标题切换">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="全球24h">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/signal.css">
</head>
<body>

<div id="app">
  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <span class="header-logo">🌍 全球24h</span>
        <span class="header-subtitle">国际新闻 · 中英切换</span>
      </div>
      <div class="header-right">
        <div class="lang-switch" id="lang-switch" role="group" aria-label="显示语言"><button type="button" data-lang="zh" class="lang-btn">中文</button><button type="button" data-lang="en" class="lang-btn">EN</button></div>
        <a class="nav-link" href="signal.html" title="情报哨兵：漏洞/天气/疫情/科技圈，按要不要动手分级">🛰 情报</a>
        <a class="nav-link" href="nanhai.html" title="佛山南海政务新闻与租金政策">南海政务</a>
        <a class="nav-link" href="audit.html" title="内容中立化质量审计">审计</a>
        <span class="update-time" id="last-updated">--:-- 更新</span>
      </div>
    </div>
  </header>

  <!-- 情报哨兵提示条：只显示「要动手/要留意」条数，点入 /signal -->
  <a class="sg-strip" id="sg-strip" href="signal.html" hidden>
    <span class="sg-strip-icon">🛰</span>
    <span class="sg-strip-text" id="sg-strip-text"></span>
    <span class="sg-strip-arrow">›</span>
  </a>

  <!-- NAV / Category -->
  <nav class="nav">
    <div class="nav-inner" id="category-bar"></div>
  </nav>

  <!-- MAIN FEED -->
  <main class="main" id="main-feed">
    <div id="news-list"></div>
    <div class="loading" id="loading">加载中...</div>
    <div class="empty" id="empty" style="display:none">暂无资讯</div>
    <div class="load-more" id="load-more" style="display:none">
      <button onclick="loadMore()">加载更多</button>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <span id="footer-sources">数据来源: 加载中…</span>
  </footer>
</div>

<!-- FAB -->
<div class="fab" id="fab">
  <button class="fab-btn" onclick="scrollToTop()" title="回到顶部">↑</button>
</div>

<script src="js/app.v2.js"></script>
<script>
(function(){
  fetch('data/signal.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    var c=d.counts||{}, act=c.act||0, watch=c.watch||0;
    var box=document.getElementById('sg-strip'); if(!box) return;
    if(!act && !watch){ return; }
    var parts=[];
    if(act) parts.push('要动手 '+act);
    if(watch) parts.push('要留意 '+watch);
    parts.push('安全/天气/疫情/科技圈');
    document.getElementById('sg-strip-text').textContent=parts.join(' · ');
    box.classList.toggle('has-act', act>0);
    box.hidden=false;
  }).catch(function(){});
})();
</script>
</body>
</html>
